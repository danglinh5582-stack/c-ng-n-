<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}
.container { width: 100%; max-width: none; margin: auto; }
.sticky-header {
    position: sticky; top: 0; z-index: 200;
    background: #f3f4f6; padding-top: 15px; padding-bottom: 10px;
}
h1 {
    text-align: center; color: #0f4c81; font-size: 37px; font-weight: bold;
    margin: 5px 0 20px; display: flex; justify-content: center; align-items: center;
}
.card {
    background: white; padding: 18px; border-radius: 10px;
    margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1);
}
.search-box { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
input, select {
    padding: 14px 16px; border: 1px solid #aaa; border-radius: 7px;
    min-width: 240px; font-size: 20px; background: white; color: #222;
}
#searchInput { flex: 1; min-width: 280px; }
.check-filter {
    display: flex; align-items: center; gap: 10px; font-size: 20px;

}
.check-filter input[type=checkbox] {
    min-width: 0; width: 24px; height: 24px; padding: 0; cursor: pointer;
}
.file-pick {
    font-size: 17px; background: #eef4fa; padding: 8px 12px;

}
.file-pick input[type=file] {

}
.stats { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 6px; }
.stat {
    flex: 1; min-width: 220px; background: #0f4c81; color: white;

}
.stat h2 { font-size: 34px; margin: 10px 0 2px; font-weight: bold; }
.table-container { overflow: visible; width: 100%; padding-top: 0; }
table {
    width: 100%; min-width: 1660px; border-collapse: separate;
    border-spacing: 0; table-layout: fixed; background: white;
}
thead th {
    background: #0f4c81; color: white; position: sticky;

thead th:hover { background: #0b3961; }
th, td {

th:first-child, td:first-child { border-left: 1px solid #ccc; }
thead th { border-top: 1px solid #ccc; }
td:nth-child(1) { width: 190px; text-align: left; overflow-wrap: anywhere; }
th:nth-child(1) { width: 190px; }
td:nth-child(2) { width: 190px; text-align: left; overflow-wrap: anywhere; }
th:nth-child(2) { width: 190px; }
td:nth-child(3) { width: 145px; text-align: center; overflow-wrap: anywhere; }
th:nth-child(3) { width: 145px; }
td:nth-child(4), td:nth-child(5), td:nth-child(6) { width: 120px; text-align: right; white-space: nowrap; }
th:nth-child(4), th:nth-child(5), th:nth-child(6) { width: 120px; }
td:nth-child(7), td:nth-child(8) { width: 150px; text-align: right; white-space: nowrap; font-weight: bold; }
th:nth-child(7), th:nth-child(8) { width: 150px; }
td:nth-child(9), td:nth-child(10) { width: 155px; text-align: center; white-space: nowrap; }
th:nth-child(9), th:nth-child(10) { width: 155px; }
td:nth-child(11) { width: 175px; text-align: center; white-space: nowrap; }
th:nth-child(11) { width: 175px; cursor: default; }
tbody tr:nth-child(even) { background: #f0f5fb; }
tbody tr:hover { background: #dcecff; cursor: pointer; }
.btn-reconcile {

.mobile-table thead th {

    position: static !important; background: #d9e2ec !important;
    color: #111827 !important; font-size: 13.5px !important; font-weight: bold !important;

    box-shadow: none !important; cursor: default !important;
    text-align: center !important; white-space: nowrap !important;

.statement-table td.num, .statement-table th.num { text-align: right !important; white-space: nowrap !important; }
.statement-table td.center, .statement-table th.center { text-align: center !important; white-space: nowrap !important; }
.statement-summary-footer {
    margin-top: 12px; display: flex; flex-direction: column;

@media (max-width: 768px) {
    body { padding: 0 10px 10px 10px; }
    .sticky-header { position: static; padding-top: 10px; }
    h1 { font-size: 28px; line-height: 1.35; margin: 8px 0 14px; }
    .card { padding: 12px; margin-bottom: 12px; }
    .search-box { flex-direction: column; align-items: stretch; gap: 10px; }
    input, select { width: 100%; min-width: 0; padding: 12px 14px; font-size: 19px; }
    .check-filter { font-size: 19px; }
    .check-filter input[type=checkbox] { width: 24px; height: 24px; padding: 0; }
    .stats { flex-direction: column; gap: 8px; }
    .stat { min-width: 0; padding: 12px 16px; font-size: 19px; }
    .stat h2 { font-size: 28px; margin: 6px 0 0; }
    .table-container { display: none; }
    .mobile-list { display: block; }
    .mobile-table thead th { cursor: pointer; user-select: none; }
    .modal { padding: 10px; }
    .modal-content { margin: 10px auto; padding: 20px; font-size: 21px; }
    .modal-content h2 { font-size: 25px; }
    .reconcile-modal-content { padding: 14px; margin: 8px auto; }
}
@media (max-width: 380px) {
    h1 { font-size: 24px; }
    .stat h2 { font-size: 25px; }
    .mobile-table thead th, .mobile-table tbody td { font-size: 15px; padding: 8px 4px; }
}
</style>
</head>

<body>
<div class="container">
    <div class="sticky-header" id="stickyHeader">
        <h1>TRA CỨU CÔNG NỢ KHÁCH HÀNG</h1>
        <div class="card" style="margin-bottom: 12px;">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Tìm tên KH, mã KH, SĐT, địa chỉ hoặc NVKD">
                <select id="nvkdFilter"><option value="">Tất cả NVKD</option></select>
                <label class="check-filter">
                    <input type="checkbox" id="overdueOnly"> Chỉ khách có nợ quá hạn
                </label>
                <label class="check-filter file-pick">
                    File công nợ tổng:
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
                </label>
                <label class="check-filter file-pick">
                    File chi tiết (CSV):
                    <input type="file" id="detailFileInput" accept=".csv,.xlsx,.xls">
                </label>
            </div>
        </div>
        <div class="stats">
            <div class="stat"><div>Tổng khách hàng</div><h2 id="tongkh">0</h2></div>
            <div class="stat"><div>Tổng công nợ quá hạn</div><h2 id="tongqh">0</h2></div>
            <div class="stat"><div>Tổng dư nợ cuối ngày</div><h2 id="tongdn">0</h2></div>
        </div>
    </div>

    <div class="card table-container">
        <table>
            <thead>
                <tr>
                    <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                    <th data-key="diachi">Địa chỉ<span class="arr"></span></th>
                    <th data-key="nvkd">NVKD<span class="arr"></span></th>
                    <th data-key="qh1">QH 1T<span class="arr"></span></th>
                    <th data-key="qh2">QH 2T<span class="arr"></span></th>
                    <th data-key="qh3">QH 3T<span class="arr"></span></th>
                    <th data-key="tongqh">Tổng QH<span class="arr"></span></th>
                    <th data-key="duno">Dư nợ<span class="arr"></span></th>
                    <th data-key="thanhtoan">TT gần nhất<span class="arr"></span></th>
                    <th data-key="muahang">Mua hàng gần nhất<span class="arr"></span></th>
                    <th>Đối chiếu</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>
        <div id="emptyTable" class="empty-message" style="display:none">Không tìm thấy khách hàng</div>
    </div>

    <div class="mobile-list" id="mobileList"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="detail"></div>
        <div class="modal-actions">
            <button type="button" class="btn-reconcile" id="modalReconcileBtn">Đối chiếu công nợ</button>
            <button type="button" class="btn-secondary" onclick="closeModal()">Đóng</button>
        </div>
    </div>
</div>

<div class="modal" id="reconcileModal">
    <div class="reconcile-modal-content">
        <span class="close" onclick="closeReconcileModal()">×</span>
        <div class="reconcile-toolbar">
            <div>
                <h2 style="margin:0;color:#0f4c81;font-size:24px;">ĐỐI CHIẾU VÀ XÁC NHẬN CÔNG NỢ</h2>
                <div id="reconcileStatusNote" style="font-size:14px;color:#4b5563;margin-top:4px;"></div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <button type="button" class="btn-download" id="downloadPngBtn" onclick="downloadReconcileImage()">Tải ảnh gửi khách (PNG)</button>
                <button type="button" class="btn-zalo" id="shareZaloBtn" onclick="shareReconcileToZalo()">Chia sẻ Zalo</button>

        </div>
        <div class="reconcile-meta-bar">
            <label for="reconcileStartDate">Mốc bắt đầu:</label>
            <input type="date" id="reconcileStartDate">
            <label for="reconcileEndDate">Ngày lập đối chiếu:</label>
            <input type="date" id="reconcileEndDate">
            <button type="button" class="btn-secondary" style="padding:7px 12px;font-size:15px;" onclick="resetAutoPeriod()">Tự động mốc 2026</button>
        </div>
        <div class="sheet-wrapper">
            <div id="reconcileSheet" class="statement-sheet"></div>
        </div>

<script>
// Mã QR trích xuất trực tiếp từ file QR-113002633897.pdf (hoặc đặt QR-113002633897.pdf cùng thư mục để ưu tiên dùng trực tiếp)
const QR_IMG_SRC = "qr_square_240.png";

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        document.documentElement.style.setProperty('--sticky-offset', header.offsetHeight + 'px');
    }
}
window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

let allData = [];
let detailRowsByCustomer = new Map();
let activeCustomer = null;
let activePeriodInfo = null;
let currentRemainingBalance = 0;
let sortKey = null;
let sortAsc = true;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

function toNumber(value) {
    if (value === null || value === undefined || value === "") return 0;
    if (typeof value === "number") return Number.isFinite(value) ? value : 0;
    const cleaned = String(value).trim().replace(/\./g, '').replace(/,/g, '.').replace(/[^0-9.-]/g, '');
    const n = Number(cleaned);
    return Number.isFinite(n) ? n : 0;
}

function parseVnDecimal(value) {
    if (value === null || value === undefined || String(value).trim() === "") return 0;
    const str = String(value).trim();
    if (str.includes(',')) return Number(str.replace(/\./g, '').replace(',', '.')) || 0;
    return Number(str.replace(/\./g, '')) || 0;
}

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 }).format(Math.round(Number(number) || 0));
}

function formatQty(qty) {
    const n = Number(qty) || 0;
    if (Number.isInteger(n)) return new Intl.NumberFormat('vi-VN').format(n);
    return new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 2 }).format(n);
}

function dateValue(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (!m) return 0;
    const year = m[3].length === 2 ? 2000 + (+m[3]) : (+m[3]);
    return year * 10000 + (+m[2]) * 100 + (+m[1]);
}

function parseVnDateToObj(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if (!m) return null;
    const d = +m[1], mo = +m[2], y = m[3].length === 2 ? 2000 + (+m[3]) : (+m[3]);
    return new Date(y, mo - 1, d);
}

function toIsoDate(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const d = String(dateObj.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function fromIsoDate(isoStr) {
    if (!isoStr) return null;
    const parts = isoStr.split('-');
    if (parts.length !== 3) return null;
    return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function formatShortVnDate(dateObj) {
    const d = String(dateObj.getDate()).padStart(2, '0');
    const m = String(dateObj.getMonth() + 1).padStart(2, '0');
    const yy = String(dateObj.getFullYear() % 100).padStart(2, '0');
    return `${d}/${m}/${yy}`;
}

function toShortVnDateFromStr(dateStr) {
    const dt = parseVnDateToObj(dateStr);
    return dt ? formatShortVnDate(dt) : String(dateStr || '');
}

function normalizeNameKey(name) {
    return String(name || "").toLowerCase().replace(/\s+/g, ' ').trim();
}

function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return dateValue(r[key]);
    return toNumber(r[key]);
}

function csvToRows(text, delimiter = ';') {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;
    const cleanText = String(text || '').replace(/^\uFEFF/, '');

    for (let i = 0; i < cleanText.length; i++) {
        const ch = cleanText[i];
        const next = cleanText[i + 1];
        if (ch === '"') {
            if (inQuotes && next === '"') { field += '"'; i++; }
            else { inQuotes = !inQuotes; }
        } else if (ch === delimiter && !inQuotes) {
            row.push(field); field = '';
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
            if (ch === '\r' && next === '\n') i++;
            row.push(field);
            if (row.some(cell => String(cell).trim() !== '')) rows.push(row);
            row = []; field = '';
        } else {
            field += ch;
        }
    }
    if (field.length > 0 || row.length > 0) {
        row.push(field);
        if (row.some(cell => String(cell).trim() !== '')) rows.push(row);
    }
    return rows;
}

function ingest(rows) {
    allData = [];
    rows.forEach(c => {
        if (c.length < 10) return;
        const s = i => String(c[i] ?? "").trim();
        if (s(0).includes('Mã KH') || s(0).includes('M? KH') || s(1).toLowerCase().includes('tổng cộng') || !s(1)) return;
        allData.push({
            ma: s(0), ten: s(1), diachi: s(2), sdt: s(3), nvkd: s(4),
            qh1: s(5), qh2: s(6), qh3: s(7), tongqh: s(8), duno: s(9),
            thanhtoan: s(10), muahang: s(11)
        });
    });
    buildNVKD();
    render();
    updateStickyOffset();
}

function ingestDetailCsv(text) {
    const rows = csvToRows(text, ';');
    if (!rows.length) return;
    const header = rows[0].map(h => String(h || '').trim());
    const idxTen = header.indexOf('Tên khách hàng');
    const idxMa = header.indexOf('Mã khách hàng');
    const idxNgayHt = header.indexOf('Ngày hạch toán');
    const idxNgayCt = header.indexOf('Ngày chứng từ');
    const idxSoCt = header.indexOf('Số chứng từ');
    const idxDienGiai = header.indexOf('Diễn giải');
    const idxDienGiaiChung = header.indexOf('Diễn giải chung');
    const idxNo = header.indexOf('Phát sinh Nợ');
    const idxCo = header.indexOf('Phát sinh Có');
    const idxDuNo = header.indexOf('Số dư Nợ');
    const idxDuCo = header.indexOf('Số dư Có');
    const idxTenHang = header.indexOf('Tên hàng');
    const idxDvt = header.indexOf('ĐVT');
    const idxSoLuong = header.indexOf('Số lượng');
    const idxDonGia = header.indexOf('Đơn giá');
    if (idxTen === -1 || idxNo === -1 || idxCo === -1) return;

    const grouped = new Map();
    let currentCustomerName = '';
    let currentCustomerCode = '';

    for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const rawTen = String(r[idxTen] ?? '').trim();
        const rawMa = idxMa >= 0 ? String(r[idxMa] ?? '').trim() : '';
        if (rawTen) { currentCustomerName = rawTen; if (rawMa) currentCustomerCode = rawMa; }
        if (!currentCustomerName) continue;

        const ngayStr = String(r[idxNgayHt] || r[idxNgayCt] || '').trim();
        const dienGiai = idxDienGiai >= 0 ? String(r[idxDienGiai] ?? '').trim() : '';
        if (!ngayStr && !dienGiai.toLowerCase().includes('số dư đầu kỳ')) continue;

        const item = {
            tenKhach: currentCustomerName,
            maKhach: currentCustomerCode,
            ngayStr,
            shortDateStr: toShortVnDateFromStr(ngayStr),
            dateObj: parseVnDateToObj(ngayStr),
            soCt: idxSoCt >= 0 ? String(r[idxSoCt] ?? '').trim() : '',
            dienGiai,
            dienGiaiChung: idxDienGiaiChung >= 0 ? String(r[idxDienGiaiChung] ?? '').trim() : '',
            noVal: parseVnDecimal(r[idxNo]),
            coVal: parseVnDecimal(r[idxCo]),
            duNoVal: idxDuNo >= 0 ? parseVnDecimal(r[idxDuNo]) : 0,
            duCoVal: idxDuCo >= 0 ? parseVnDecimal(r[idxDuCo]) : 0,
            tenHang: idxTenHang >= 0 ? String(r[idxTenHang] ?? '').trim() : '',
            dvt: idxDvt >= 0 ? String(r[idxDvt] ?? '').trim() : '',
            soLuong: idxSoLuong >= 0 ? parseVnDecimal(r[idxSoLuong]) : 0,
            donGia: idxDonGia >= 0 ? parseVnDecimal(r[idxDonGia]) : 0
        };

        const nameKey = normalizeNameKey(currentCustomerName);
        if (!grouped.has(nameKey)) grouped.set(nameKey, []);
        grouped.get(nameKey).push(item);

        if (currentCustomerCode) {
            const codeKey = 'code:' + normalizeNameKey(currentCustomerCode);
            if (!grouped.has(codeKey)) grouped.set(codeKey, []);
            grouped.get(codeKey).push(item);
        }
    }
    detailRowsByCustomer = grouped;
}

function getCustomerDetailRows(customer) {
    if (!customer) return [];
    const byName = detailRowsByCustomer.get(normalizeNameKey(customer.ten));
    if (byName && byName.length) return byName;
    if (customer.ma) {
        const byCode = detailRowsByCustomer.get('code:' + normalizeNameKey(customer.ma));
        if (byCode && byCode.length) return byCode;
    }
    const target = normalizeNameKey(customer.ten);
    for (const [k, list] of detailRowsByCustomer.entries()) {
        if (!k.startsWith('code:') && (k.includes(target) || target.includes(k))) return list;
    }
    return [];
}

function computeAutoPeriod(customer, rows) {
    const year2026Rows = rows.filter(r => r.dateObj && r.dateObj.getFullYear() === 2026);
    let lastZeroIdxIn2026 = -1;
    for (let i = year2026Rows.length - 1; i >= 0; i--) {
        const row = year2026Rows[i];
        if (Math.abs(row.duNoVal) < 0.5 && Math.abs(row.duCoVal) < 0.5) { lastZeroIdxIn2026 = i; break; }
    }
    const defaultEnd = new Date(2026, 10, 19);
    let maxDataDate = null;
    rows.forEach(r => { if (r.dateObj && (!maxDataDate || r.dateObj > maxDataDate)) maxDataDate = r.dateObj; });
    const endDate = maxDataDate && maxDataDate > defaultEnd ? maxDataDate : defaultEnd;

    if (lastZeroIdxIn2026 >= 0) {
        const startDate = year2026Rows[lastZeroIdxIn2026].dateObj;
        return {
            modeLabel: `Từ mốc hết nợ (= 0) ngày ${formatShortVnDate(startDate)} trong năm 2026`,
            startDate, endDate, openingBalance: 0
        };
    }

    const jan1 = new Date(2026, 0, 1);
    let openingBalance = toNumber(customer && customer.duno);
    const beforeJan1 = rows.filter(r => !r.dateObj || r.dateObj < jan1);
    if (beforeJan1.length > 0) {
        const lastBefore = beforeJan1[beforeJan1.length - 1];
        openingBalance = lastBefore.duNoVal - lastBefore.duCoVal;
    } else if (year2026Rows.length > 0) {
        const first2026 = year2026Rows[0];
        openingBalance = Math.max(0, first2026.duNoVal - first2026.noVal + first2026.coVal);
    }
    return {
        modeLabel: "Chưa từng hết nợ trong năm 2026 → Lấy dữ liệu từ 01/01/26",
        startDate: jan1, endDate, openingBalance: Math.round(openingBalance)
    };
}

function buildStatementEntries(rows, startDate, endDate, openingBalance) {
    const startNum = startDate.getFullYear() * 10000 + (startDate.getMonth() + 1) * 100 + startDate.getDate();
    const endNum = endDate.getFullYear() * 10000 + (endDate.getMonth() + 1) * 100 + endDate.getDate();

    let calcOpening = openingBalance;
    const isDefaultJan1 = startDate.getFullYear() === 2026 && startDate.getMonth() === 0 && startDate.getDate() === 1;
    if (!isDefaultJan1 && rows.length > 0) {
        const priorRows = rows.filter(r => {
            if (!r.dateObj) return false;
            const n = r.dateObj.getFullYear() * 10000 + (r.dateObj.getMonth() + 1) * 100 + r.dateObj.getDate();
            return n < startNum;
        });
        if (priorRows.length > 0) {
            const lastPrior = priorRows[priorRows.length - 1];
            calcOpening = Math.round(lastPrior.duNoVal - lastPrior.duCoVal);
        }
    }

    const filtered = rows.filter(r => {
        if (!r.dateObj) return false;
        const n = r.dateObj.getFullYear() * 10000 + (r.dateObj.getMonth() + 1) * 100 + r.dateObj.getDate();
        return n >= startNum && n <= endNum;
    });

    const entries = [];
    const saleMap = new Map();

    for (const r of filtered) {
        const isVatLine = r.dienGiai.toLowerCase().startsWith('thuế gtgt') || r.tenHang.toLowerCase().startsWith('thuế gtgt');
        const isDiscountLine = r.dienGiai.toLowerCase().startsWith('chiết khấu');
        const isSaleDoc = r.soCt.toUpperCase().startsWith('BH/') || (r.noVal > 0 && r.soLuong > 0);
        const isPaymentOrReturn = r.coVal > 0 && !isSaleDoc;

        if (isSaleDoc || (isVatLine && r.noVal > 0)) {
            const baseItemName = r.tenHang || r.dienGiai.replace(/^Thuế GTGT\s*-\s*/i, '').trim();
            const key = `${r.ngayStr}|${r.soCt}|${baseItemName}`;
            if (!saleMap.has(key)) {
                const entry = {
                    stt: entries.length + 1, dateStr: r.shortDateStr,
                    itemName: `Bán hàng ${baseItemName}`, unit: r.dvt || '', qty: r.soLuong || 0,
                    vatNetTotal: 0, vatTaxTotal: 0, unitPriceWithVat: 0, amountDebit: 0, amountCredit: 0
                };
                saleMap.set(key, entry);
                entries.push(entry);
            }
            const entry = saleMap.get(key);
            if (r.soLuong > 0 && !entry.qty) entry.qty = r.soLuong;
            if (r.dvt && !entry.unit) entry.unit = r.dvt;
            if (isVatLine) entry.vatTaxTotal += r.noVal;
            else entry.vatNetTotal += r.noVal;

            const grossAmount = entry.vatNetTotal + entry.vatTaxTotal;
            entry.amountDebit = Math.round(grossAmount);
            entry.unitPriceWithVat = entry.qty > 0 ? Math.round(grossAmount / entry.qty) : Math.round(grossAmount);
        } else if (isDiscountLine && r.coVal > 0) {
            const cleanDesc = r.dienGiai.replace(/^Chiết khấu thương mại\s*-\s*/i, '').trim();
            entries.push({
                stt: entries.length + 1, dateStr: r.shortDateStr, itemName: `Chiết khấu ${cleanDesc}`,
                unit: '', qty: 0, unitPriceWithVat: 0, amountDebit: 0, amountCredit: Math.round(r.coVal)
            });
        } else if (isPaymentOrReturn) {
            let label = r.dienGiai || r.dienGiaiChung || 'Thanh toán / Trả lại / Giảm giá';
            if (r.soCt.toUpperCase().startsWith('BGG') && !label.toLowerCase().includes('giảm giá')) label = 'Giảm giá ' + label;
            else if (r.soCt.toUpperCase().startsWith('BTL') && !label.toLowerCase().includes('trả lại')) label = 'Trả lại ' + label;
            entries.push({
                stt: entries.length + 1, dateStr: r.shortDateStr, itemName: label,
                unit: '', qty: 0, unitPriceWithVat: 0, amountDebit: 0, amountCredit: Math.round(r.coVal)
            });
        } else if (r.noVal > 0) {
            entries.push({
                stt: entries.length + 1, dateStr: r.shortDateStr,
                itemName: r.dienGiai || r.tenHang || 'Phát sinh nợ',
                unit: r.dvt || '', qty: r.soLuong || 0,
                unitPriceWithVat: Math.round(r.donGia || r.noVal), amountDebit: Math.round(r.noVal), amountCredit: 0
            });
        }
    }

    entries.forEach((e, idx) => { e.stt = idx + 1; });
    const totalDebit = entries.reduce((sum, e) => sum + e.amountDebit, 0);
    const totalCredit = entries.reduce((sum, e) => sum + e.amountCredit, 0);
    const remainingBalance = calcOpening + totalDebit - totalCredit;

    return { openingBalance: calcOpening, entries, totalDebit, totalCredit, remainingBalance };
}

        <div class="statement-summary-footer">
            <div class="summary-line"><span>Số tiền đã thanh toán:</span><span class="val">${formatNumber(report.totalCredit)}</span><span style="min-width:44px;text-align:left;">Đồng</span></div>
            <div class="summary-line"><span>Số tiền còn phải thanh toán:</span><span class="val">${formatNumber(report.remainingBalance)}</span><span style="min-width:44px;text-align:left;">Đồng</span></div>
        </div>`;
}

function openReconcileModal(customer) {
    activeCustomer = customer;
    const rows = getCustomerDetailRows(customer);
    const period = computeAutoPeriod(customer, rows);
    activePeriodInfo = period;
    document.getElementById("reconcileStartDate").value = toIsoDate(period.startDate);
    document.getElementById("reconcileEndDate").value = toIsoDate(period.endDate);
    document.getElementById("reconcileStatusNote").textContent = rows.length === 0
        ? `Chưa tìm thấy dòng chi tiết của "${customer.ten}" trong chitietcongnophaithu.csv — đang hiển thị dư nợ tổng (${formatNumber(toNumber(customer.duno))} đ).`
        : `${period.modeLabel} (${rows.length} dòng chi tiết từ CSV).`;
    renderReconcileSheet();
    document.getElementById("reconcileModal").style.display = "block";
}

function resetAutoPeriod() { if (activeCustomer) openReconcileModal(activeCustomer); }
function closeReconcileModal() { document.getElementById("reconcileModal").style.display = "none"; }

document.getElementById("reconcileStartDate").addEventListener("change", renderReconcileSheet);
document.getElementById("reconcileEndDate").addEventListener("change", renderReconcileSheet);

async function captureReconcileBlobAndUrl() {
    const sheet = document.getElementById("reconcileSheet");
    const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const dataUrl = canvas.toDataURL("image/png");
    const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/png"));
    const safeName = String(activeCustomer.ten || "khach_hang")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "");
    const endDt = fromIsoDate(document.getElementById("reconcileEndDate").value) || new Date(2026, 10, 19);
    const datePart = formatShortVnDate(endDt).replace(/\//g, "");
    return { dataUrl, blob, fileName: `Doi_chieu_cong_no_${safeName || "khach"}_${datePart}.png`, dateLabel: formatShortVnDate(endDt) };
}

async function downloadReconcileImage() {
    const btn = document.getElementById("downloadPngBtn");
    if (!activeCustomer) return;
    const oldText = btn.textContent; btn.disabled = true; btn.textContent = "Đang tạo ảnh...";
    try {
        const { dataUrl, fileName } = await captureReconcileBlobAndUrl();
        const link = document.createElement("a");
        link.download = fileName; link.href = dataUrl;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    } catch (err) { alert("Không thể xuất ảnh PNG: " + err.message); }
    finally { btn.disabled = false; btn.textContent = oldText; }
}

async function shareReconcileToZalo() {
    const btn = document.getElementById("shareZaloBtn");
    if (!activeCustomer) return;
    const oldText = btn.textContent; btn.disabled = true; btn.textContent = "Đang chuẩn bị chia sẻ...";
    try {
        const { dataUrl, blob, fileName, dateLabel } = await captureReconcileBlobAndUrl();
        const summaryText = `Biên bản đối chiếu công nợ khách hàng ${activeCustomer.ten} (Ngày lập đối chiếu: ${dateLabel}) - Số tiền còn phải thanh toán: ${formatNumber(currentRemainingBalance)} Đồng.`;
        if (blob && navigator.share && navigator.canShare) {
            const file = new File([blob], fileName, { type: "image/png" });
            if (navigator.canShare({ files: [file] })) {
                await navigator.share({ title: `Đối chiếu công nợ - ${activeCustomer.ten}`, text: summaryText, files: [file] });
                return;
            }
        }
        const link = document.createElement("a");
        link.download = fileName; link.href = dataUrl;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            try { await navigator.clipboard.writeText(summaryText); } catch (_) {}
        }
        window.open("https://chat.zalo.me/", "_blank", "noopener,noreferrer");
        alert(`Đã tải ảnh "${fileName}" và sao chép nội dung tóm tắt. Bạn chọn ảnh vừa tải trong Zalo để gửi cho khách nhé.`);
    } catch (err) {
        if (err && err.name !== "AbortError") alert("Không thể chia sẻ sang Zalo: " + err.message);
    } finally { btn.disabled = false; btn.textContent = oldText; }
}

document.getElementById("modal").addEventListener("click", function(e) { if (e.target === this) closeModal(); });
document.getElementById("reconcileModal").addEventListener("click", function(e) { if (e.target === this) closeReconcileModal(); });
document.addEventListener("keydown", function(e) { if (e.key === "Escape") { closeModal(); closeReconcileModal(); } });
</script>
</body>
