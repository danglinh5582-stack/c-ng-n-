<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 15px;
    padding-bottom: 10px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 37px;
    font-weight: bold;
    margin: 5px 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 14px 16px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 300px;
    font-size: 22px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
}

/* Ô tích chọn lọc */
.check-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

.check-filter input[type=checkbox] {
    min-width: 0;
    width: 26px;
    height: 26px;
    padding: 0;
    cursor: pointer;
}

/* Ô chọn file Excel */
.file-pick {
    font-size: 20px;
}

.file-pick input[type=file] {
    min-width: 0;
    width: auto;
    padding: 8px;
    font-size: 17px;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.stat {
    flex: 1;
    min-width: 220px;
    background: #0f4c81;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
}

.stat h2 {
    font-size: 34px;
    margin: 10px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

table {
    width: 100%;
    min-width: 1500px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px);
    z-index: 100;
    font-size: 23px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
    cursor: pointer;
    user-select: none;
}

thead th:hover {
    background: #0b3961;
}

th, td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 23px;
    line-height: 1.5;
    vertical-align: middle;
}

th:first-child,
td:first-child {
    border-left: 1px solid #ccc;
}

thead th {
    border-top: 1px solid #ccc;
}

td:nth-child(1) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(1) { width: 190px; }

td:nth-child(2) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(2) { width: 190px; }

td:nth-child(3) {
    width: 155px;
    text-align: center;
    overflow-wrap: anywhere;
}
th:nth-child(3) { width: 155px; }

td:nth-child(4),
td:nth-child(5),
td:nth-child(6) {
    width: 125px;
    text-align: right;
    white-space: nowrap;
}
th:nth-child(4), th:nth-child(5), th:nth-child(6) { width: 125px; }

td:nth-child(7),
td:nth-child(8) {
    width: 155px;
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
}
th:nth-child(7), th:nth-child(8) { width: 155px; }

td:nth-child(9),
td:nth-child(10) {
    width: 160px;
    text-align: center;
    white-space: nowrap;
}
th:nth-child(9), th:nth-child(10) { width: 160px; }

tbody tr:nth-child(even) {
    background: #f0f5fb;
}

tbody tr:hover {
    background: #dcecff;
    cursor: pointer;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 25px;
    color: #666;
}

/* ================= DANH SÁCH ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.mobile-table-card {
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    overflow-x: auto;
}

.mobile-table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    table-layout: auto;
    background: white;
}

.mobile-table thead th {
    position: static;
    background: #0f4c81;
    color: white;
    font-size: 18px;
    padding: 10px 8px;
    text-align: center !important;
    border: 1px solid #0b3961;
    box-shadow: none;
}

.mobile-table tbody td {
    font-size: 18px;
    line-height: 1.4;
    padding: 12px 8px;
    border: 1px solid #d1d5db;
    vertical-align: middle;
}

.mobile-table tbody td:nth-child(1) {
    width: auto;
    text-align: left;
    font-weight: bold;
    color: #0f4c81;
    overflow-wrap: anywhere;
}

.mobile-table tbody td:nth-child(2) {
    width: auto;
    text-align: right;
    white-space: nowrap;
    color: #c0392b;
    font-weight: bold;
}

.mobile-table tbody td:nth-child(3) {
    width: auto;
    text-align: right;
    white-space: nowrap;
    color: #0f4c81;
    font-weight: bold;
}

/* ================= CHI TIẾT KHÁCH HÀNG ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    overflow-y: auto;
    padding: 15px;
}

.modal-content {
    background: white;
    max-width: 800px;
    width: 100%;
    margin: 30px auto;
    padding: 28px;
    border-radius: 12px;
    font-size: 25px;
    line-height: 1.7;
}

.modal-content h2 {
    font-size: 32px;
    color: #0f4c81;
    margin-top: 10px;
}

.modal-content p {
    margin: 14px 0;
    overflow-wrap: anywhere;
}

.modal-content hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 20px 0;
}

.phone-link {
    color: #0f4c81;
    font-weight: bold;
    text-decoration: none;
}

.phone-link:hover {
    text-decoration: underline;
}

.close {
    float: right;
    font-size: 41px;
    font-weight: bold;
    cursor: pointer;
    color: #555;
    line-height: 1;
}

.label {
    font-weight: bold;
    color: #333;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 768px) {

    body {
        padding: 0 10px 10px 10px;
    }

    .sticky-header {
        position: static;
        padding-top: 10px;
    }

    h1 {
        font-size: 28px;
        line-height: 1.35;
        margin: 8px 0 14px;
    }

    .card {
        padding: 12px;
        margin-bottom: 12px;
    }

    .search-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }

    input, select {
        width: 100%;
        min-width: 0;
        padding: 12px 14px;
        font-size: 19px;
    }

    .check-filter {
        font-size: 19px;
    }

    .check-filter input[type=checkbox] {
        width: 24px;
        height: 24px;
        padding: 0;
    }

    .stats {
        flex-direction: column;
        gap: 8px;
    }

    .stat {
        min-width: 0;
        padding: 12px 16px;
        font-size: 19px;
    }

    .stat h2 {
        font-size: 28px;
        margin: 6px 0 0;
    }

    .table-container {
        display: none;
    }

    .mobile-list {
        display: block;
    }

    .mobile-table thead th {
        cursor: pointer;
        user-select: none;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 20px;
        font-size: 21px;
    }

    .modal-content h2 {
        font-size: 25px;
    }

}

@media (max-width: 380px) {

    h1 {
        font-size: 24px;
    }

    .stat h2 {
        font-size: 25px;
    }

    .mobile-table thead th,
    .mobile-table tbody td {
        font-size: 16px;
        padding: 10px 6px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- KHU VỰC ĐƯỢC GHIM CỐ ĐỊNH KHI CUỘN -->
    <div class="sticky-header" id="stickyHeader">

        <h1>TRA CỨU CÔNG NỢ KHÁCH HÀNG</h1>

        <!-- TÌM KIẾM VÀ LỌC -->
        <div class="card" style="margin-bottom: 12px;">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm tên KH, mã KH, SĐT, địa chỉ hoặc NVKD">

                <select id="nvkdFilter">
                    <option value="">Tất cả NVKD</option>
                </select>

                <label class="check-filter">
                    <input type="checkbox" id="overdueOnly">
                    Chỉ khách có nợ quá hạn
                </label>

                <label class="check-filter file-pick">
                    Chọn file Excel:
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
                </label>
            </div>
        </div>

        <!-- THỐNG KÊ -->
        <div class="stats">
            <div class="stat">
                <div>Tổng khách hàng</div>
                <h2 id="tongkh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng công nợ quá hạn</div>
                <h2 id="tongqh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng dư nợ cuối ngày</div>
                <h2 id="tongdn">0</h2>
            </div>
        </div>

    </div>

    <!-- BẢNG MÁY TÍNH -->
    <div class="card table-container">

        <table>
            <thead>
                <tr>
                    <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                    <th data-key="diachi">Địa chỉ<span class="arr"></span></th>
                    <th data-key="nvkd">NVKD<span class="arr"></span></th>
                    <th data-key="qh1">QH 1T<span class="arr"></span></th>
                    <th data-key="qh2">QH 2T<span class="arr"></span></th>
                    <th data-key="qh3">QH 3T<span class="arr"></span></th>
                    <th data-key="tongqh">Tổng QH<span class="arr"></span></th>
                    <th data-key="duno">Dư nợ<span class="arr"></span></th>
                    <th data-key="thanhtoan">TT gần nhất<span class="arr"></span></th>
                    <th data-key="muahang">Mua hàng gần nhất<span class="arr"></span></th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>

        <div id="emptyTable" class="empty-message" style="display:none">
            Không tìm thấy khách hàng
        </div>

    </div>

    <!-- BẢNG GỌN CHO ĐIỆN THOẠI -->
    <div class="mobile-list" id="mobileList"></div>

</div>

<!-- CHI TIẾT KHÁCH HÀNG -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="detail"></div>
    </div>
</div>

<script>

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

let allData = [];

// Trạng thái sắp xếp (mặc định: dư nợ giảm dần)
let sortKey = "duno";
let sortAsc = false;

const TEXT_KEYS = ["ten", "diachi", "nvkd"];
const DATE_KEYS = ["thanhtoan", "muahang"];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {
    if (!value) return 0;
    return Number(
        String(value)
        .replace(/\./g, '')
        .replace(/,/g, '')
        .replace(/-/g, '0')
        .trim()
    ) || 0;
}

// ================= ĐỊNH DẠNG SỐ =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

// Chuyển ngày dd/mm/yyyy thành số để so sánh
function dateValue(s) {
    const m = String(s || "").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    return m ? (+m[3]) * 10000 + (+m[2]) * 100 + (+m[1]) : 0;
}

// Giá trị dùng để sắp xếp
function sortValue(r, key) {
    if (TEXT_KEYS.includes(key)) return (r[key] || "").toLowerCase();
    if (DATE_KEYS.includes(key)) return dateValue(r[key]);
    return toNumber(r[key]);
}

// ================= NẠP DỮ LIỆU (CSV HOẶC EXCEL) =================

// Chuyển nội dung CSV (phân cách bằng ;) thành mảng các dòng
function csvToRows(text) {
    return text
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter(x => x.trim() !== '')
        .map(r => r.split(';'));
}

// Nhận mảng các dòng, mỗi dòng là mảng các ô, rồi hiển thị
function ingest(rows) {
    allData = [];

    rows.forEach(c => {
        if (c.length < 10) return;

        const s = i => String(c[i] ?? "").trim();

        if (
            s(0).includes('Mã KH') ||
            s(0).includes('M? KH') ||
            s(1).toLowerCase().includes('tổng cộng') ||
            !s(1)
        ) return;

        allData.push({
            ma: s(0),
            ten: s(1),
            diachi: s(2),
            sdt: s(3),
            nvkd: s(4),
            qh1: s(5),
            qh2: s(6),
            qh3: s(7),
            tongqh: s(8),
            duno: s(9),
            thanhtoan: s(10),
            muahang: s(11)
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
}

// Chọn file từ máy: hỗ trợ .xlsx, .xls và .csv
document.getElementById("fileInput").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;

    if (/\.csv$/i.test(f.name)) {
        f.text().then(t => ingest(csvToRows(t)));
        return;
    }

    f.arrayBuffer().then(buf => {
        try {
            const wb = XLSX.read(buf, { type: "array" });
            const ws = wb.Sheets[wb.SheetNames[0]];
            // raw:false lấy đúng chữ hiển thị trong Excel (số có dấu chấm, ngày dd/mm/yyyy)
            ingest(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: false }));
        } catch (err) {
            alert("Không đọc được file Excel: " + err.message);
        }
    });
});

// ================= ĐỌC FILE CSV TRÊN GITHUB =================

fetch('Congno.csv?v=' + Date.now(), { cache: 'no-store' })
.then(r => {
    if (!r.ok) {
        throw new Error('Không tìm thấy file Congno.csv');
    }
    return r.text();
})
.then(text => {
    ingest(csvToRows(text));
})
.catch(error => {
    document.getElementById("dataBody").innerHTML =
        `<tr><td colspan="10" style="text-align:center;color:red">
        Lỗi tải dữ liệu: ${error.message}
        </td></tr>`;
});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    select.innerHTML = '<option value="">Tất cả NVKD</option>';
    ds.sort();

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= BẤM TIÊU ĐỀ ĐỂ SẮP XẾP =================

function setSort(key) {
    if (sortKey === key) {
        sortAsc = !sortAsc;
    } else {
        sortKey = key;
        // Cột chữ: A→Z trước; cột số/ngày: lớn → nhỏ trước
        sortAsc = TEXT_KEYS.includes(key);
    }
    render();
}

document.querySelectorAll("thead th[data-key]").forEach(th => {
    th.addEventListener("click", () => setSort(th.dataset.key));
});

function updateArrows() {
    document.querySelectorAll("th[data-key]").forEach(th => {
        const arr = th.querySelector(".arr");
        if (!arr) return;
        arr.textContent = th.dataset.key === sortKey ? (sortAsc ? " ▲" : " ▼") : "";
    });
}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {
    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const overdueOnly = document
        .getElementById("overdueOnly")
        .checked;

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {
        const text = (
            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.sdt + " " +
            r.nvkd
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd)
            && (!overdueOnly || toNumber(r.tongqh) > 0);
    });

    data.sort((a, b) => {
        const x = sortValue(a, sortKey);
        const y = sortValue(b, sortKey);
        let cmp;
        if (typeof x === "string") cmp = x.localeCompare(y, "vi");
        else cmp = x - y;
        return sortAsc ? cmp : -cmp;
    });

    let tongQH = 0;
    let tongDN = 0;

    // Tạo bảng gọn cho điện thoại: Tên KH | Tổng nợ quá hạn | Dư nợ cuối
    const mobileCard = document.createElement("div");
    mobileCard.className = "mobile-table-card";

    const mobileTable = document.createElement("table");
    mobileTable.className = "mobile-table";
    mobileTable.innerHTML = `
        <thead>
            <tr>
                <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                <th data-key="tongqh">Tổng nợ quá hạn<span class="arr"></span></th>
                <th data-key="duno">Dư nợ cuối<span class="arr"></span></th>
            </tr>
        </thead>
    `;
    mobileTable.querySelectorAll("th[data-key]").forEach(th => {
        th.addEventListener("click", () => setSort(th.dataset.key));
    });
    const mobileTbody = document.createElement("tbody");

    data.forEach(r => {
        tongQH += toNumber(r.tongqh);
        tongDN += toNumber(r.duno);

        // BẢNG MÁY TÍNH
        const tr = document.createElement("tr");
        tr.onclick = () => showDetail(r);

        [
            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            r.thanhtoan,
            r.muahang
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
        });

        body.appendChild(tr);

        // DÒNG BẢNG ĐIỆN THOẠI (3 CỘT)
        const mTr = document.createElement("tr");
        mTr.onclick = () => showDetail(r);

        const tdTen = document.createElement("td");
        tdTen.textContent = r.ten || "Chưa có tên khách hàng";

        const tdQH = document.createElement("td");
        tdQH.textContent = r.tongqh || "0";

        const tdDN = document.createElement("td");
        tdDN.textContent = r.duno || "0";

        mTr.appendChild(tdTen);
        mTr.appendChild(tdQH);
        mTr.appendChild(tdDN);
        mobileTbody.appendChild(mTr);
    });

    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "Không tìm thấy khách hàng";
        mobileList.appendChild(empty);
    } else {
        mobileTable.appendChild(mobileTbody);
        mobileCard.appendChild(mobileTable);
        mobileList.appendChild(mobileCard);
    }

    document.getElementById("tongkh").innerText = formatNumber(data.length);
    document.getElementById("tongqh").innerText = formatNumber(tongQH);
    document.getElementById("tongdn").innerText = formatNumber(tongDN);

    updateArrows();
}

// ================= TÌM KIẾM / LỌC =================

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("nvkdFilter").addEventListener("change", render);
document.getElementById("overdueOnly").addEventListener("change", render);

// ================= CHI TIẾT KHÁCH HÀNG =================

function showDetail(r) {
    document.getElementById("modal").style.display = "block";

    const detail = document.getElementById("detail");
    detail.innerHTML = "";

    const h2 = document.createElement("h2");
    h2.textContent = r.ten;
    detail.appendChild(h2);

    const cleanSdt = (r.sdt || "").trim();
    const sdtDisplay = cleanSdt && cleanSdt !== "0" ? cleanSdt : "Chưa cập nhật";

    const fields = [
        ["Mã KH:", r.ma],
        ["Số điện thoại:", sdtDisplay, true],
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", r.thanhtoan],
        ["Ngày mua hàng gần nhất:", r.muahang]
    ];

    fields.forEach((item, index) => {
        if (index === 4 || index === 9) {
            detail.appendChild(document.createElement("hr"));
        }

        const p = document.createElement("p");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0] + " ";
        p.appendChild(label);

        if (item[2] && item[1] !== "Chưa cập nhật") {
            const link = document.createElement("a");
            link.href = "tel:" + item[1].replace(/[^0-9+]/g, '');
            link.className = "phone-link";
            link.textContent = item[1];
            p.appendChild(link);
        } else {
            p.appendChild(document.createTextNode(item[1] || "Chưa cập nhật"));
        }

        detail.appendChild(p);
    });
}

// ================= ĐÓNG CHI TIẾT =================

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

document.getElementById("modal").addEventListener("click", function(e) {
    if (e.target === this) {
        closeModal();
    }
});

document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeModal();
    }
});

</script>
