<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 15px;
    padding-bottom: 10px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 37px;
    font-weight: bold;
    margin: 5px 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

input, select {
    padding: 14px 16px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 300px;
    font-size: 22px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.stat {
    flex: 1;
    min-width: 220px;
    background: #0f4c81;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
}

.stat h2 {
    font-size: 34px;
    margin: 10px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

table {
    width: 100%;
    min-width: 1500px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

/* Ghim tiêu đề bảng ngay dưới khu vực sticky-header */
thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px); /* Tự động tính toán bằng JS */
    z-index: 100;
    font-size: 23px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
}

th, td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 23px;
    line-height: 1.5;
    vertical-align: middle;
}

/* Viền trái và trên bảng */

th:first-child,
td:first-child {
    border-left: 1px solid #ccc;
}

thead th {
    border-top: 1px solid #ccc;
}

/* Tên khách hàng */
td:nth-child(1) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(1) { width: 190px; }

/* Địa chỉ */
td:nth-child(2) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}
th:nth-child(2) { width: 190px; }

/* NVKD */
td:nth-child(3) {
    width: 155px;
    text-align: center;
    overflow-wrap: anywhere;
}
th:nth-child(3) { width: 155px; }

/* QH 1T, QH 2T, QH 3T */
td:nth-child(4),
td:nth-child(5),
td:nth-child(6) {
    width: 125px;
    text-align: right;
    white-space: nowrap;
}
th:nth-child(4), th:nth-child(5), th:nth-child(6) { width: 125px; }

/* Tổng QH và Dư nợ */
td:nth-child(7),
td:nth-child(8) {
    width: 155px;
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
}
th:nth-child(7), th:nth-child(8) { width: 155px; }

/* Ngày thanh toán và mua hàng */
td:nth-child(9),
td:nth-child(10) {
    width: 160px;
    text-align: center;
    white-space: nowrap;
}
th:nth-child(9), th:nth-child(10) { width: 160px; }

/* Màu nền xen kẽ */

tbody tr:nth-child(even) {
    background: #f0f5fb;
}

tbody tr:hover {
    background: #dcecff;
    cursor: pointer;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 25px;
    color: #666;
}

/* ================= THẺ KHÁCH HÀNG ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.customer-card {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    cursor: pointer;
}

.customer-name {
    font-size: 26px;
    font-weight: bold;
    color: #0f4c81;
    line-height: 1.5;
    margin-bottom: 14px;
    overflow-wrap: anywhere;
}

.customer-info {
    font-size: 23px;
    line-height: 1.6;
    margin-bottom: 9px;
    overflow-wrap: anywhere;
}

.customer-info strong {
    color: #333;
}

.customer-finance {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
}

.finance-item {
    background: #f1f5fa;
    padding: 14px;
    border-radius: 8px;
    min-width: 0;
}

.finance-label {
    font-size: 21px;
    color: #555;
    margin-bottom: 7px;
}

.finance-value {
    font-size: 24px;
    font-weight: bold;
    color: #222;
    overflow-wrap: anywhere;
}

.finance-total {
    background: #fff0ed;
}

.finance-total .finance-value {
    color: #c0392b;
}

.finance-debt {
    background: #e8f2ff;
}

.finance-debt .finance-value {
    color: #0f4c81;
}

.customer-date {
    border-top: 1px solid #ddd;
    margin-top: 15px;
    padding-top: 12px;
    font-size: 22px;
    line-height: 1.7;
}

/* ================= CHI TIẾT KHÁCH HÀNG ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    overflow-y: auto;
    padding: 15px;
}

.modal-content {
    background: white;
    max-width: 800px;
    width: 100%;
    margin: 30px auto;
    padding: 28px;
    border-radius: 12px;
    font-size: 25px;
    line-height: 1.7;
}

.modal-content h2 {
    font-size: 32px;
    color: #0f4c81;
    margin-top: 10px;
}

.modal-content p {
    margin: 14px 0;
    overflow-wrap: anywhere;
}

.modal-content hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 20px 0;
}

.phone-link {
    color: #0f4c81;
    font-weight: bold;
    text-decoration: none;
}

.phone-link:hover {
    text-decoration: underline;
}

.close {
    float: right;
    font-size: 41px;
    font-weight: bold;
    cursor: pointer;
    color: #555;
    line-height: 1;
}

.label {
    font-weight: bold;
    color: #333;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 768px) {

    body {
        padding: 0 10px 10px 10px;
    }

    /* Trên điện thoại bỏ ghim cả khối lớn để không che mất màn hình */
    .sticky-header {
        position: static;
        padding-top: 10px;
    }

    h1 {
        font-size: 29px;
        line-height: 1.4;
        margin: 10px 0 15px;
    }

    .card {
        padding: 14px;
    }

    .search-box {
        flex-direction: column;
    }

    input, select {
        width: 100%;
        min-width: 0;
        padding: 14px;
        font-size: 21px;
    }

    .stats {
        flex-direction: column;
        gap: 10px;
    }

    .stat {
        min-width: 0;
        padding: 15px;
        font-size: 21px;
    }

    .stat h2 {
        font-size: 30px;
    }

    /* Ẩn bảng trên điện thoại */
    .table-container {
        display: none;
    }

    /* Hiện thẻ khách hàng */
    .mobile-list {
        display: block;
    }

    .customer-card {
        padding: 18px;
    }

    .customer-name {
        font-size: 26px;
    }

    .customer-info {
        font-size: 23px;
    }

    .finance-label {
        font-size: 20px;
    }

    .finance-value {
        font-size: 23px;
    }

    .customer-date {
        font-size: 21px;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 20px;
        font-size: 23px;
    }

    .modal-content h2 {
        font-size: 27px;
    }

}

/* ================= ĐIỆN THOẠI MÀN HÌNH NHỎ ================= */

@media (max-width: 380px) {

    .customer-finance {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 26px;
    }

    .stat h2 {
        font-size: 28px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- KHU VỰC ĐƯỢC GHIM CỐ ĐỊNH KHI CUỘN -->
    <div class="sticky-header" id="stickyHeader">

        <h1>TRA CỨU CÔNG NỢ KHÁCH HÀNG</h1>

        <!-- TÌM KIẾM VÀ LỌC -->
        <div class="card" style="margin-bottom: 12px;">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm tên KH, mã KH, SĐT, địa chỉ hoặc NVKD">

                <select id="nvkdFilter">
                    <option value="">Tất cả NVKD</option>
                </select>
            </div>
        </div>

        <!-- THỐNG KÊ -->
        <div class="stats">
            <div class="stat">
                <div>Tổng khách hàng</div>
                <h2 id="tongkh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng công nợ quá hạn</div>
                <h2 id="tongqh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng dư nợ cuối ngày</div>
                <h2 id="tongdn">0</h2>
            </div>
        </div>

    </div>

    <!-- BẢNG MÁY TÍNH -->
    <div class="card table-container">

        <table>
            <thead>
                <tr>
                    <th>Tên khách hàng</th>
                    <th>Địa chỉ</th>
                    <th>NVKD</th>
                    <th>QH 1T</th>
                    <th>QH 2T</th>
                    <th>QH 3T</th>
                    <th>Tổng QH</th>
                    <th>Dư nợ</th>
                    <th>TT gần nhất</th>
                    <th>Mua hàng gần nhất</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>

        <div id="emptyTable" class="empty-message" style="display:none">
            Không tìm thấy khách hàng
        </div>

    </div>

    <!-- DANH SÁCH ĐIỆN THOẠI -->
    <div class="mobile-list" id="mobileList"></div>

</div>

<!-- CHI TIẾT KHÁCH HÀNG -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="detail"></div>
    </div>
</div>

<script>

// ================= TỰ ĐỘNG CÂN CHỈNH VỊ TRÍ GHIM TIÊU ĐỀ BẢNG =================

function updateStickyOffset() {
    const header = document.getElementById('stickyHeader');
    if (header) {
        const height = header.offsetHeight;
        document.documentElement.style.setProperty('--sticky-offset', height + 'px');
    }
}

window.addEventListener('load', updateStickyOffset);
window.addEventListener('resize', updateStickyOffset);

// ================= DỮ LIỆU =================

let allData = [];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {
    if (!value) return 0;
    return Number(
        String(value)
        .replace(/\./g, '')
        .replace(/,/g, '')
        .replace(/-/g, '0')
        .trim()
    ) || 0;
}

// ================= ĐỊNH DẠNG SỐ =================

function formatNumber(number) {
    return new Intl.NumberFormat('vi-VN').format(number);
}

// ================= ĐỌC FILE CSV =================

fetch('Congno.csv')
.then(r => {
    if (!r.ok) {
        throw new Error('Không tìm thấy file Congno.csv');
    }
    return r.text();
})
.then(text => {
    const rows = text
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter(x => x.trim() !== '');

    rows.forEach(row => {
        const c = row.split(';');

        if (c.length < 11) return;

        if (
            c[0].includes('Mã KH') ||
            c[0].includes('M? KH')
        ) return;

        /* 
           LƯU Ý VỊ TRÍ CỘT SĐT:
           Hiện tại đang lấy cột thứ 12 (c[11]) làm cột SĐT.
           Nếu cột SĐT trong file CSV của bạn nằm ở vị trí khác, 
           bạn hãy điều chỉnh lại số thứ tự c[...] tương ứng bên dưới.
        */
        allData.push({
            ma: c[0]?.trim(),
            ten: c[1]?.trim(),
            diachi: c[2]?.trim(),
            nvkd: c[3]?.trim(),
            qh1: c[4]?.trim(),
            qh2: c[5]?.trim(),
            qh3: c[6]?.trim(),
            tongqh: c[7]?.trim(),
            duno: c[8]?.trim(),
            thanhtoan: c[9]?.trim(),
            muahang: c[10]?.trim(),
            sdt: c[11]?.trim() || ""
        });
    });

    buildNVKD();
    render();
    updateStickyOffset();
})
.catch(error => {
    document.getElementById("dataBody").innerHTML =
        `<tr><td colspan="10" style="text-align:center;color:red">
        Lỗi tải dữ liệu: ${error.message}
        </td></tr>`;
});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {
    const ds = [
        ...new Set(
            allData
            .map(x => x.nvkd)
            .filter(x => x)
        )
    ];

    const select = document.getElementById("nvkdFilter");
    ds.sort();

    ds.forEach(x => {
        const op = document.createElement("option");
        op.value = x;
        op.textContent = x;
        select.appendChild(op);
    });
}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {
    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const body = document.getElementById("dataBody");
    const mobileList = document.getElementById("mobileList");

    body.innerHTML = "";
    mobileList.innerHTML = "";

    const data = allData.filter(r => {
        const text = (
            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.nvkd + " " +
            r.sdt
        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd);
    });

    // Sắp xếp dư nợ giảm dần
    data.sort((a, b) => toNumber(b.duno) - toNumber(a.duno));

    let tongQH = 0;
    let tongDN = 0;

    data.forEach(r => {
        tongQH += toNumber(r.tongqh);
        tongDN += toNumber(r.duno);

        // BẢNG MÁY TÍNH
        const tr = document.createElement("tr");
        tr.onclick = () => showDetail(r);

        [
            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            r.thanhtoan,
            r.muahang
        ].forEach(value => {
            const td = document.createElement("td");
            td.textContent = value || "";
            tr.appendChild(td);
        });

        body.appendChild(tr);

        // THẺ ĐIỆN THOẠI
        const card = document.createElement("div");
        card.className = "customer-card";
        card.onclick = () => showDetail(r);

        const name = document.createElement("div");
        name.className = "customer-name";
        name.textContent = r.ten || "Chưa có tên khách hàng";
        card.appendChild(name);

        addInfo(card, "Địa chỉ:", r.diachi);
        addInfo(card, "NVKD:", r.nvkd);

        const finance = document.createElement("div");
        finance.className = "customer-finance";

        addFinance(finance, "Quá hạn 1 tháng", r.qh1);
        addFinance(finance, "Quá hạn 2 tháng", r.qh2);
        addFinance(finance, "Quá hạn 3 tháng", r.qh3);
        addFinance(finance, "Tổng quá hạn", r.tongqh, "finance-total");
        addFinance(finance, "Dư nợ cuối ngày", r.duno, "finance-debt");

        card.appendChild(finance);

        const dates = document.createElement("div");
        dates.className = "customer-date";

        const tt = document.createElement("div");
        tt.textContent = "TT gần nhất: " + (r.thanhtoan || "");

        const mh = document.createElement("div");
        mh.textContent = "Mua hàng gần nhất: " + (r.muahang || "");

        dates.appendChild(tt);
        dates.appendChild(mh);
        card.appendChild(dates);

        const hint = document.createElement("div");
        hint.style.cssText =
            "color:#0f4c81;font-size:19px;font-weight:bold;margin-top:14px;text-align:right";
        hint.textContent = "Bấm để xem chi tiết →";
        card.appendChild(hint);

        mobileList.appendChild(card);
    });

    // KHÔNG CÓ DỮ LIỆU
    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "Không tìm thấy khách hàng";
        mobileList.appendChild(empty);
    }

    // CẬP NHẬT THỐNG KÊ
    document.getElementById("tongkh").innerText = formatNumber(data.length);
    document.getElementById("tongqh").innerText = formatNumber(tongQH);
    document.getElementById("tongdn").innerText = formatNumber(tongDN);
}

// ================= THÔNG TIN THẺ =================

function addInfo(parent, label, value) {
    const div = document.createElement("div");
    div.className = "customer-info";

    const strong = document.createElement("strong");
    strong.textContent = label + " ";
    div.appendChild(strong);

    div.appendChild(document.createTextNode(value || ""));
    parent.appendChild(div);
}

// ================= Ô CÔNG NỢ =================

function addFinance(parent, label, value, extraClass = "") {
    const item = document.createElement("div");
    item.className = "finance-item " + extraClass;

    const title = document.createElement("div");
    title.className = "finance-label";
    title.textContent = label;

    const number = document.createElement("div");
    number.className = "finance-value";
    number.textContent = value || "0";

    item.appendChild(title);
    item.appendChild(number);
    parent.appendChild(item);
}

// ================= TÌM KIẾM =================

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("nvkdFilter").addEventListener("change", render);

// ================= CHI TIẾT KHÁCH HÀNG =================

function showDetail(r) {
    document.getElementById("modal").style.display = "block";

    const detail = document.getElementById("detail");
    detail.innerHTML = "";

    const h2 = document.createElement("h2");
    h2.textContent = r.ten;
    detail.appendChild(h2);

    const fields = [
        ["Mã KH:", r.ma],
        ["Số điện thoại:", r.sdt, true], // Đánh dấu là SĐT để tạo link gọi
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", r.thanhtoan],
        ["Ngày mua hàng gần nhất:", r.muahang]
    ];

    fields.forEach((item, index) => {
        if (index === 4 || index === 9) {
            detail.appendChild(document.createElement("hr"));
        }

        const p = document.createElement("p");
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = item[0] + " ";
        p.appendChild(label);

        if (item[2] && item[1]) {
            const link = document.createElement("a");
            link.href = "tel:" + item[1].replace(/\s+/g, '');
            link.className = "phone-link";
            link.textContent = item[1];
            p.appendChild(link);
        } else {
            p.appendChild(document.createTextNode(item[1] || "Chưa cập nhật"));
        }

        detail.appendChild(p);
    });
}

// ================= ĐÓNG CHI TIẾT =================

function closeModal() {
    document.getElementById("modal").style.display = "none";
}

// Bấm ra ngoài để đóng
document.getElementById("modal").addEventListener("click", function(e) {
    if (e.target === this) {
        closeModal();
    }
});

// Nhấn ESC để đóng
document.addEventListener("keydown", function(e) {
    if (e.key === "Escape") {
        closeModal();
    }
});

</script>

</body>
</html>
