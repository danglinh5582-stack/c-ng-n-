<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Công nợ khách hàng</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f5f5f5;
}
.container{
    max-width:800px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}
h1{
    text-align:center;
    color:#0066cc;
}
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}
th{
    background:#0066cc;
    color:white;
}
</style>
</head>

<body>
<div class="container">
    <h1>Báo cáo công nợ</h1>

    <table>
        <tr>
            <th>Khách hàng</th>
            <th>Công nợ</th>
        </tr>
        <tr>
            <td>Khách hàng A</td>
            <td>100.000.000</td>
        </tr>
        <tr>
            <td>Khách hàng B</td>
            <td>50.000.000</td>
        </tr>
    </table>

</div>
</body>
</html>
