<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 15px;
    padding-bottom: 10px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 37px;
    font-weight: bold;
    margin: 5px 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 14px 16px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 240px;
    font-size: 20px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
    min-width: 280px;
}

/* Ô tích chọn lọc */
.check-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

.check-filter input[type=checkbox] {
    min-width: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    cursor: pointer;
}

/* Ô chọn file Excel / CSV */
.file-pick {
    font-size: 17px;
    background: #eef4fa;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px dashed #0f4c81;
}

.file-pick input[type=file] {
    min-width: 0;
    width: auto;
    max-width: 210px;
    padding: 4px;
    font-size: 15px;
    background: transparent;
    border: none;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.stat {
    flex: 1;
    min-width: 220px;
    background: #0f4c81;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
}

.stat h2 {
    font-size: 34px;
    margin: 10px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

.main-table {
    width: 100%;
    min-width: 1660px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

.main-table thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px);
    z-index: 100;
    font-size: 21px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
    cursor: pointer;
    user-select: none;
}

.main-table thead th:hover {
    background: #0b3961;
}

.main-table th, .main-table td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 21px;
    line-height: 1.45;
    vertical-align: middle;
}

.main-table th:first-child,
.main-table td:first-child {
    border-left: 1px solid #ccc;
}

.main-table thead th {
    border-top: 1px solid #ccc;
}

.main-table td:nth-child(1) { width: 190px; text-align: left; overflow-wrap: anywhere; }
.main-table th:nth-child(1) { width: 190px; }

.main-table td:nth-child(2) { width: 190px; text-align: left; overflow-wrap: anywhere; }
.main-table th:nth-child(2) { width: 190px; }

.main-table td:nth-child(3) { width: 145px; text-align: center; overflow-wrap: anywhere; }
.main-table th:nth-child(3) { width: 145px; }

.main-table td:nth-child(4),
.main-table td:nth-child(5),
.main-table td:nth-child(6) { width: 120px; text-align: right; white-space: nowrap; }
.main-table th:nth-child(4), .main-table th:nth-child(5), .main-table th:nth-child(6) { width: 120px; }

.main-table td:nth-child(7),
.main-table td:nth-child(8) { width: 150px; text-align: right; white-space: nowrap; font-weight: bold; }
.main-table th:nth-child(7), .main-table th:nth-child(8) { width: 150px; }

.main-table td:nth-child(9),
.main-table td:nth-child(10) { width: 155px; text-align: center; white-space: nowrap; }
.main-table th:nth-child(9), .main-table th:nth-child(10) { width: 155px; }

.main-table td:nth-child(11) { width: 175px; text-align: center; white-space: nowrap; }
.main-table th:nth-child(11) { width: 175px; cursor: default; }

.main-table tbody tr:nth-child(even) {
    background: #f0f5fb;
}

.main-table tbody tr:hover {
    background: #dcecff;
    cursor: pointer;
}

.btn-reconcile {
    background: #0f766e;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s ease;
}

.btn-reconcile:hover {
    background: #115e59;
}

.btn-download {
    background: #0f4c81;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.btn-download:hover {
    background: #0b3961;
}

.btn-secondary {
    background: #e5e7eb;
    color: #1f2937;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.btn-secondary:hover {
    background: #d1d5db;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 25px;
    color: #666;
}

/* ================= DANH SÁCH ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.mobile-table-card {
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    overflow-x: auto;
}

.mobile-table {
    width: 100%;
    min-width: 0;
    border-collapse: collapse;
    table-layout: auto;
    background: white;
}

.mobile-table thead th {
    position: static;
    background: #0f4c81;
    color: white;
    font-size: 17px;
    padding: 10px 6px;
    text-align: center !important;
    border: 1px solid #0b3961;
    box-shadow: none;
}

.mobile-table tbody td {
    font-size: 17px;
    line-height: 1.35;
    padding: 10px 6px;
    border: 1px solid #d1d5db;
    vertical-align: middle;
}

.mobile-table tbody td:nth-child(1) {
    width: auto;
    text-align: left;
    font-weight: bold;
    color: #0f4c81;
    overflow-wrap: anywhere;
}

.mobile-table tbody td:nth-child(2) {
    width: auto;
    text-align: right;
    white-space: nowrap;
    color: #c0392b;
    font-weight: bold;
}

.mobile-table tbody td:nth-child(3) {
    width: auto;
    text-align: right;
    white-space: nowrap;
    color: #0f4c81;
    font-weight: bold;
}

.mobile-table tbody td:nth-child(4) {
    width: auto;
    text-align: center;
    white-space: nowrap;
}

.mobile-btn-reconcile {
    background: #0f766e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 9px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

/* ================= CHI TIẾT KHÁCH HÀNG ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    overflow-y: auto;
    padding: 15px;
}

.modal-content {
    background: white;
    max-width: 820px;
    width: 100%;
    margin: 24px auto;
    padding: 28px;
    border-radius: 12px;
    font-size: 23px;
    line-height: 1.65;
}

.modal-content h2 {
    font-size: 30px;
    color: #0f4c81;
    margin-top: 6px;
}

.modal-content p {
    margin: 12px 0;
    overflow-wrap: anywhere;
}

.modal-content hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 18px 0;
}

.modal-actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 22px;
}

.phone-link {
    color: #0f4c81;
    font-weight: bold;
    text-decoration: none;
}

.phone-link:hover {
    text-decoration: underline;
}

.close {
    float: right;
    font-size: 41px;
    font-weight: bold;
    cursor: pointer;
    color: #555;
    line-height: 1;
}

.label {
    font-weight: bold;
    color: #333;
}

/* ================= MODAL ĐỐI CHIẾU CÔNG NỢ ================= */

.reconcile-modal-content {
    background: #ffffff;
    max-width: 1120px;
    width: 100%;
    margin: 20px auto;
    padding: 22px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

.reconcile-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e5e7eb;
}

.reconcile-meta-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 14px;
    font-size: 16px;
    background: #f8fafc;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
}

.reconcile-meta-bar label {
    font-weight: bold;
    color: #0f4c81;
}

.reconcile-meta-bar input[type="date"] {
    min-width: 0;
    padding: 6px 10px;
    font-size: 16px;
}

.sheet-wrapper {
    overflow-x: auto;
    background: #fff;
    padding: 6px;
}

/* Bảng mẫu biên bản đối chiếu công nợ */
.statement-sheet {
    width: 1020px;
    min-width: 1020px;
    background: #ffffff;
    color: #111827;
    font-family: Arial, sans-serif;
    padding: 18px 22px 24px 22px;
    border: 1px solid #d1d5db;
}

.sheet-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 14px;
}

.company-block {
    font-size: 13.5px;
    line-height: 1.5;
    font-weight: bold;
    text-transform: uppercase;
    max-width: 390px;
}

.qr-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
}

.qr-img {
    width: 96px;
    height: 96px;
    border: 1.5px solid #0f4c81;
    padding: 3px;
    background: #ffffff;
    display: block;
}

.title-block {
    text-align: right;
    flex: 1;
}

.title-block .main-title {
    font-size: 17px;
    font-weight: bold;
    color: #0f4c81;
    line-height: 1.3;
}

.title-block .sub-title {
    font-size: 15px;
    font-weight: bold;
    color: #0f4c81;
    margin-top: 2px;
}

.customer-header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    margin-bottom: 6px;
    font-size: 15px;
    font-weight: bold;
}

.customer-name-line {
    display: flex;
    gap: 20px;
}

.report-date-text {
    font-style: italic;
    font-weight: bold;
    font-size: 15px;
}

.opening-balance-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 18px;
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

/* Căn chỉnh các cột STT, Ngày, ĐVT, SL, Đơn giá, Thành tiền ôm khít nội dung; bỏ cột Ghi chú */
.statement-table {
    width: 100%;
    min-width: 0;
    table-layout: auto;
    border-collapse: collapse;
    font-size: 13.5px;
}

.statement-table th {
    position: static !important;
    background: #d9e2ec !important;
    color: #111827 !important;
    font-size: 13.5px !important;
    font-weight: bold !important;
    border: 1px solid #829ab1 !important;
    padding: 7px 8px !important;
    box-shadow: none !important;
    cursor: default !important;
    text-align: center !important;
}

.statement-table td {
    border: 1px solid #9fb3c8 !important;
    padding: 6px 8px !important;
    font-size: 13.5px !important;
    line-height: 1.35 !important;
    background: #ffffff !important;
    color: #111827 !important;
    font-weight: normal !important;
}

.statement-table th.fit-col,
.statement-table td.fit-col {
    width: 1%;
    white-space: nowrap !important;
}

.statement-table th.item-col,
.statement-table td.item-col {
    width: auto;
    white-space: normal;
}

.statement-table th.pay-col,
.statement-table td.pay-col {
    width: 145px;
    white-space: normal;
}

.statement-table tr.total-row td {
    font-weight: bold !important;
    background: #f0f4f8 !important;
}

.statement-table td.num {
    text-align: right !important;
    white-space: nowrap !important;
}

.statement-table td.center {
    text-align: center !important;
    white-space: nowrap !important;
}

.statement-summary-footer {
    margin-top: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    font-size: 15px;
    font-weight: bold;
}

.summary-line {
    display: flex;
    justify-content: flex-end;
    gap: 24px;
    min-width: 340px;
}

.summary-line .val {
    min-width: 135px;
    text-align: right;
    color: #0f4c81;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 768px) {

    body {
        padding: 0 10px 10px 10px;
    }

    .sticky-header {
        position: static;
        padding-top: 10px;
    }

    h1 {
        font-size: 28px;
        line-height: 1.35;
        margin: 8px 0 14px;
    }

    .card {
        padding: 12px;
        margin-bottom: 12px;
    }

    .search-box {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }

    input, select {
        width: 100%;
        min-width: 0;
        padding: 12px 14px;
        font-size: 19px;
    }

    .check-filter {
        font-size: 19px;
    }

    .check-filter input[type=checkbox] {
        width: 24px;
        height: 24px;
        padding: 0;
    }

    .stats {
        flex-direction: column;
        gap: 8px;
    }

    .stat {
        min-width: 0;
        padding: 12px 16px;
        font-size: 19px;
    }

    .stat h2 {
        font-size: 28px;
        margin: 6px 0 0;
    }

    .table-container {
        display: none;
    }

    .mobile-list {
        display: block;
    }

    .mobile-table thead th {
        cursor: pointer;
        user-select: none;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 20px;
        font-size: 21px;
    }

    .modal-content h2 {
        font-size: 25px;
    }

    .reconcile-modal-content {
        padding: 14px;
        margin: 8px auto;
    }

}

@media (max-width: 380px) {

    h1 {
        font-size: 24px;
    }

    .stat h2 {
        font-size: 25px;
    }

    .mobile-table thead th,
    .mobile-table tbody td {
        font-size: 15px;
        padding: 8px 4px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- KHU VỰC ĐƯỢC GHIM CỐ ĐỊNH KHI CUỘN -->
    <div class="sticky-header" id="stickyHeader">

        <h1>TRA CỨU CÔNG NỢ KHÁCH HÀNG</h1>

        <!-- TÌM KIẾM VÀ LỌC -->
        <div class="card" style="margin-bottom: 12px;">
            <div class="search-box">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Tìm tên KH, mã KH, SĐT, địa chỉ hoặc NVKD">

                <select id="nvkdFilter">
                    <option value="">Tất cả NVKD</option>
                </select>

                <label class="check-filter">
                    <input type="checkbox" id="overdueOnly">
                    Chỉ khách có nợ quá hạn
                </label>

                <label class="check-filter file-pick">
                    File công nợ tổng:
                    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
                </label>

                <label class="check-filter file-pick">
                    File chi tiết (CSV):
                    <input type="file" id="detailFileInput" accept=".csv,.xlsx,.xls">
                </label>
            </div>
        </div>

        <!-- THỐNG KÊ -->
        <div class="stats">
            <div class="stat">
                <div>Tổng khách hàng</div>
                <h2 id="tongkh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng công nợ quá hạn</div>
                <h2 id="tongqh">0</h2>
            </div>

            <div class="stat">
                <div>Tổng dư nợ cuối ngày</div>
                <h2 id="tongdn">0</h2>
            </div>
        </div>

    </div>

    <!-- BẢNG MÁY TÍNH -->
    <div class="card table-container">

        <table class="main-table">
            <thead>
                <tr>
                    <th data-key="ten">Tên khách hàng<span class="arr"></span></th>
                    <th data-key="diachi">Địa chỉ<span class="arr"></span></th>
                    <th data-key="nvkd">NVKD<span class="arr"></span></th>
                    <th data-key="qh1">QH 1T<span class="arr"></span></th>
                    <th data-key="qh2">QH 2T<span class="arr"></span></th>
                    <th data-key="qh3">QH 3T<span class="arr"></span></th>
                    <th data-key="tongqh">Tổng QH<span class="arr"></span></th>
                    <th data-key="duno">Dư nợ<span class="arr"></span></th>
                    <th data-key="thanhtoan">TT gần nhất<span class="arr"></span></th>
                    <th data-key="muahang">Mua hàng gần nhất<span class="arr"></span></th>
                    <th>Đối chiếu</th>
                </tr>
            </thead>
            <tbody id="dataBody"></tbody>
        </table>

        <div id="emptyTable" class="empty-message" style="display:none">
            Không tìm thấy khách hàng
        </div>

    </div>

    <!-- BẢNG GỌN CHO ĐIỆN THOẠI -->
    <div class="mobile-list" id="mobileList"></div>

</div>

<!-- CHI TIẾT KHÁCH HÀNG -->
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close" onclick="closeModal()">×</span>
        <div id="detail"></div>
        <div class="modal-actions">
            <button type="button" class="btn-reconcile" id="modalReconcileBtn">
                Đối chiếu công nợ
            </button>
            <button type="button" class="btn-secondary" onclick="closeModal()">
                Đóng
            </button>
        </div>
    </div>
</div>

<!-- MODAL ĐỐI CHIẾU CÔNG NỢ & TẢI ẢNH -->
<div class="modal" id="reconcileModal">
    <div class="reconcile-modal-content">
        <span class="close" onclick="closeReconcileModal()">×</span>

        <div class="reconcile-toolbar">
            <div>
                <h2 style="margin:0;color:#0f4c81;font-size:24px;">ĐỐI CHIẾU VÀ XÁC NHẬN CÔNG NỢ</h2>
                <div id="reconcileStatusNote" style="font-size:14px;color:#4b5563;margin-top:4px;"></div>
            </div>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <button type="button" class="btn-download" id="downloadPngBtn" onclick="downloadReconcileImage()">
                    Tải ảnh gửi khách (PNG)
                </button>
                <button type="button" class="btn-secondary" onclick="closeReconcileModal()">
                    Đóng
                </button>
            </div>
        </div>

        <div class="reconcile-meta-bar">
            <label for="reconcileStartDate">Mốc bắt đầu:</label>
            <input type="date" id="reconcileStartDate">

            <label for="reconcileEndDate">Ngày lập đối chiếu:</label>
            <input type="date" id="reconcileEndDate">

            <button type="button" class="btn-secondary" style="padding:7px 12px;font-size:15px;" onclick="resetAutoPeriod()">
                Tự động mốc 2026
            </button>
        </div>
