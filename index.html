
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 32px;
    font-weight: bold;
    margin: 20px 0 25px;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 16px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

input, select {
    padding: 15px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 280px;
    font-size: 19px;
    background: white;
    color: #222;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 16px;
}

.stat {
    flex: 1;
    min-width: 220px;
    background: #0f4c81;
    color: white;
    padding: 18px;
    border-radius: 10px;
    font-size: 19px;
    font-weight: bold;
}

.stat h2 {
    font-size: 32px;
    margin: 12px 0 5px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU MÁY TÍNH ================= */

.table-container {
    overflow-x: auto;
    width: 100%;
}

table {
    width: 100%;
    min-width: 1500px;
    border-collapse: collapse;
    table-layout: fixed;
    background: white;
}

th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: 0;
    font-size: 19px;
    font-weight: bold;
    text-align: center;
    white-space: normal;
}

th, td {
    padding: 12px 10px;
    border: 1px solid #ccc;
    font-size: 19px;
    line-height: 1.5;
    vertical-align: middle;
}

/* Tên khách hàng */

th:nth-child(1),
td:nth-child(1) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}

/* Địa chỉ */

th:nth-child(2),
td:nth-child(2) {
    width: 190px;
    text-align: left;
    overflow-wrap: anywhere;
    word-break: normal;
}

/* NVKD */

th:nth-child(3),
td:nth-child(3) {
    width: 155px;
    text-align: center;
    overflow-wrap: anywhere;
}

/* QH 1T, QH 2T, QH 3T */

th:nth-child(4), td:nth-child(4),
th:nth-child(5), td:nth-child(5),
th:nth-child(6), td:nth-child(6) {
    width: 125px;
    text-align: right;
    white-space: nowrap;
}

/* Tổng QH và Dư nợ */

th:nth-child(7), td:nth-child(7),
th:nth-child(8), td:nth-child(8) {
    width: 155px;
    text-align: right;
    white-space: nowrap;
    font-weight: bold;
}

/* Ngày thanh toán và mua hàng */

th:nth-child(9), td:nth-child(9),
th:nth-child(10), td:nth-child(10) {
    width: 160px;
    text-align: center;
    white-space: nowrap;
}

/* Hiệu ứng dòng */

tbody tr:nth-child(even) {
    background: #f5f8fc;
}

tbody tr:hover {
    background: #e1efff;
    cursor: pointer;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 20px;
    color: #666;
}

/* ================= THẺ KHÁCH HÀNG ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.customer-card {
    background: white;
    border-radius: 12px;
    padding: 17px;
    margin-bottom: 14px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
    cursor: pointer;
}

.customer-name {
    font-size: 21px;
    font-weight: bold;
    color: #0f4c81;
    line-height: 1.45;
    margin-bottom: 12px;
    overflow-wrap: anywhere;
}

.customer-info {
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 8px;
    overflow-wrap: anywhere;
}

.customer-info strong {
    color: #333;
}

.customer-finance {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
}

.finance-item {
    background: #f1f5fa;
    padding: 12px;
    border-radius: 8px;
    min-width: 0;
}

.finance-label {
    font-size: 16px;
    color: #555;
    margin-bottom: 6px;
}

.finance-value {
    font-size: 19px;
    font-weight: bold;
    color: #222;
    overflow-wrap: anywhere;
}

.finance-total {
    background: #fff0ed;
}

.finance-total .finance-value {
    color: #c0392b;
}

.finance-debt {
    background: #e8f2ff;
}

.finance-debt .finance-value {
    color: #0f4c81;
}

.customer-date {
    border-top: 1px solid #ddd;
    margin-top: 13px;
    padding-top: 10px;
    font-size: 17px;
    line-height: 1.7;
}

/* ================= CỬA SỔ CHI TIẾT ================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.6);
    z-index: 1000;
    overflow-y: auto;
    padding: 15px;
}

.modal-content {
    background: white;
    max-width: 750px;
    width: 100%;
    margin: 30px auto;
    padding: 25px;
    border-radius: 12px;
    font-size: 20px;
    line-height: 1.6;
}

.modal-content h2 {
    font-size: 27px;
    color: #0f4c81;
    margin-top: 10px;
}

.modal-content p {
    margin: 12px 0;
    overflow-wrap: anywhere;
}

.modal-content hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 18px 0;
}

.close {
    float: right;
    font-size: 36px;
    font-weight: bold;
    cursor: pointer;
    color: #555;
    line-height: 1;
}

.label {
    font-weight: bold;
    color: #333;
}

/* ================= ĐIỆN THOẠI ================= */

@media (max-width: 768px) {

    body {
        padding: 10px;
    }

    h1 {
        font-size: 26px;
        line-height: 1.4;
        margin: 15px 0 20px;
    }

    .card {
        padding: 12px;
    }

    .search-box {
        flex-direction: column;
    }

    input, select {
        width: 100%;
        min-width: 0;
        padding: 15px;
        font-size: 18px;
    }

    .stats {
        flex-direction: column;
        gap: 10px;
    }

    .stat {
        min-width: 0;
        padding: 15px;
        font-size: 18px;
    }

    .stat h2 {
        font-size: 28px;
    }

    /* Ẩn bảng trên điện thoại */

    .table-container {
        display: none;
    }

    /* Hiện danh sách thẻ khách hàng */

    .mobile-list {
        display: block;
    }

    .customer-name {
        font-size: 20px;
    }

    .customer-info {
        font-size: 18px;
    }

    .finance-label {
        font-size: 15px;
    }

    .finance-value {
        font-size: 18px;
    }

    .customer-date {
        font-size: 16px;
    }

    .modal {
        padding: 10px;
    }

    .modal-content {
        margin: 10px auto;
        padding: 18px;
        font-size: 19px;
    }

    .modal-content h2 {
        font-size: 23px;
    }

}

/* ================= ĐIỆN THOẠI MÀN HÌNH RẤT NHỎ ================= */

@media (max-width: 380px) {

    .customer-finance {
        grid-template-columns: 1fr;
    }

    h1 {
        font-size: 23px;
    }

    .stat h2 {
        font-size: 25px;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>TRA CỨU CÔNG NỢ KHÁCH HÀNG</h1>

<!-- TÌM KIẾM VÀ LỌC -->

<div class="card">

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Tìm tên KH, mã KH, địa chỉ hoặc NVKD">

        <select id="nvkdFilter">

            <option value="">Tất cả NVKD</option>

        </select>

    </div>

</div>

<!-- THỐNG KÊ -->

<div class="stats">

    <div class="stat">

        <div>Tổng khách hàng</div>

        <h2 id="tongkh">0</h2>

    </div>

    <div class="stat">

        <div>Tổng công nợ quá hạn</div>

        <h2 id="tongqh">0</h2>

    </div>

    <div class="stat">

        <div>Tổng dư nợ cuối ngày</div>

        <h2 id="tongdn">0</h2>

    </div>

</div>

<!-- BẢNG DỮ LIỆU MÁY TÍNH -->

<div class="card table-container">

<table>

<thead>

<tr>

    <th>Tên khách hàng</th>

    <th>Địa chỉ</th>

    <th>NVKD</th>

    <th>QH 1T</th>

    <th>QH 2T</th>

    <th>QH 3T</th>

    <th>Tổng QH</th>

    <th>Dư nợ</th>

    <th>TT gần nhất</th>

    <th>Mua hàng gần nhất</th>

</tr>

</thead>

<tbody id="dataBody"></tbody>

</table>

<div id="emptyTable" class="empty-message" style="display:none">
    Không tìm thấy khách hàng
</div>

</div>

<!-- DANH SÁCH RIÊNG CHO ĐIỆN THOẠI -->

<div class="mobile-list" id="mobileList"></div>

</div>

<!-- CỬA SỔ CHI TIẾT KHÁCH HÀNG -->

<div class="modal" id="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">×</span>

        <div id="detail"></div>

    </div>

</div>

<script>

// ================= DỮ LIỆU =================

let allData = [];

// ================= CHUYỂN ĐỔI SỐ =================

function toNumber(value) {

    if (!value) return 0;

    return Number(

        String(value)
        .replace(/\./g, '')
        .replace(/,/g, '')
        .replace(/-/g, '0')
        .trim()

    ) || 0;

}

// ================= ĐỊNH DẠNG SỐ =================

function formatNumber(number) {

    return new Intl.NumberFormat('vi-VN')
        .format(number);

}

// ================= ĐỌC FILE CSV =================

fetch('Congno.csv')

.then(r => {

    if (!r.ok) {

        throw new Error('Không tìm thấy file Congno.csv');

    }

    return r.text();

})

.then(text => {

    const rows = text
        .replace(/^\uFEFF/, '')
        .split(/\r?\n/)
        .filter(x => x.trim() !== '');

    rows.forEach(row => {

        const c = row.split(';');

        if (c.length < 11) return;

        if (
            c[0].includes('Mã KH') ||
            c[0].includes('M? KH')
        ) return;

        allData.push({

            ma: c[0]?.trim(),
            ten: c[1]?.trim(),
            diachi: c[2]?.trim(),
            nvkd: c[3]?.trim(),
            qh1: c[4]?.trim(),
            qh2: c[5]?.trim(),
            qh3: c[6]?.trim(),
            tongqh: c[7]?.trim(),
            duno: c[8]?.trim(),
            thanhtoan: c[9]?.trim(),
            muahang: c[10]?.trim()

        });

    });

    buildNVKD();

    render();

})

.catch(error => {

    document.getElementById("dataBody").innerHTML =
        `<tr><td colspan="10" style="text-align:center;color:red">
        Lỗi tải dữ liệu: ${error.message}
        </td></tr>`;

});

// ================= TẠO DANH SÁCH NVKD =================

function buildNVKD() {

    const ds = [

        ...new Set(

            allData
            .map(x => x.nvkd)
            .filter(x => x)

        )

    ];

    const select =
        document.getElementById("nvkdFilter");

    ds.sort();

    ds.forEach(x => {

        const op = document.createElement("option");

        op.value = x;

        op.textContent = x;

        select.appendChild(op);

    });

}

// ================= HIỂN THỊ DỮ LIỆU =================

function render() {

    const keyword = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    const nvkd = document
        .getElementById("nvkdFilter")
        .value;

    const body =
        document.getElementById("dataBody");

    const mobileList =
        document.getElementById("mobileList");

    body.innerHTML = "";

    mobileList.innerHTML = "";

    const data = allData.filter(r => {

        const text = (

            r.ma + " " +
            r.ten + " " +
            r.diachi + " " +
            r.nvkd

        ).toLowerCase();

        return text.includes(keyword)
            && (!nvkd || r.nvkd === nvkd);

    });

    // Sắp xếp dư nợ giảm dần

    data.sort(

        (a, b) =>
            toNumber(b.duno) - toNumber(a.duno)

    );

    let tongQH = 0;

    let tongDN = 0;

    // ================= LẶP TỪNG KHÁCH HÀNG =================

    data.forEach(r => {

        tongQH += toNumber(r.tongqh);

        tongDN += toNumber(r.duno);

        // ----- BẢNG MÁY TÍNH -----

        const tr = document.createElement("tr");

        tr.onclick = () => showDetail(r);

        [

            r.ten,
            r.diachi,
            r.nvkd,
            r.qh1,
            r.qh2,
            r.qh3,
            r.tongqh,
            r.duno,
            r.thanhtoan,
            r.muahang

        ].forEach(value => {

            const td = document.createElement("td");

            td.textContent = value || "";

            tr.appendChild(td);

        });

        body.appendChild(tr);

        // ----- THẺ ĐIỆN THOẠI -----

        const card = document.createElement("div");

        card.className = "customer-card";

        card.onclick = () => showDetail(r);

        const name = document.createElement("div");

        name.className = "customer-name";

        name.textContent = r.ten || "Chưa có tên khách hàng";

        card.appendChild(name);

        // Địa chỉ và NVKD

        addInfo(card, "Địa chỉ:", r.diachi);

        addInfo(card, "NVKD:", r.nvkd);

        // Các chỉ tiêu công nợ

        const finance = document.createElement("div");

        finance.className = "customer-finance";

        addFinance(finance, "Quá hạn 1 tháng", r.qh1);

        addFinance(finance, "Quá hạn 2 tháng", r.qh2);

        addFinance(finance, "Quá hạn 3 tháng", r.qh3);

        addFinance(finance, "Tổng quá hạn", r.tongqh, "finance-total");

        addFinance(finance, "Dư nợ cuối ngày", r.duno, "finance-debt");

        card.appendChild(finance);

        // Ngày thanh toán và mua hàng

        const dates = document.createElement("div");

        dates.className = "customer-date";

        const tt = document.createElement("div");

        tt.textContent =
            "TT gần nhất: " + (r.thanhtoan || "");

        const mh = document.createElement("div");

        mh.textContent =
            "Mua hàng gần nhất: " + (r.muahang || "");

        dates.appendChild(tt);

        dates.appendChild(mh);

        card.appendChild(dates);

        // Gợi ý bấm xem chi tiết

        const hint = document.createElement("div");

        hint.style.cssText =
            "color:#0f4c81;font-size:16px;font-weight:bold;margin-top:12px;text-align:right";

        hint.textContent = "Bấm để xem chi tiết →";

        card.appendChild(hint);

        mobileList.appendChild(card);

    });

    // Thông báo khi không có kết quả

    document.getElementById("emptyTable")
        .style.display = data.length === 0 ? "block" : "none";

    if (data.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent = "Không tìm thấy khách hàng";

        mobileList.appendChild(empty);

    }

    // ================= CẬP NHẬT THỐNG KÊ =================

    document.getElementById("tongkh")
        .innerText = formatNumber(data.length);

    document.getElementById("tongqh")
        .innerText = formatNumber(tongQH);

    document.getElementById("tongdn")
        .innerText = formatNumber(tongDN);

}

// ================= TẠO THÔNG TIN THẺ =================

function addInfo(parent, label, value) {

    const div = document.createElement("div");

    div.className = "customer-info";

    const strong = document.createElement("strong");

    strong.textContent = label + " ";

    div.appendChild(strong);

    div.appendChild(
        document.createTextNode(value || "")
    );

    parent.appendChild(div);

}

// ================= TẠO Ô CÔNG NỢ =================

function addFinance(parent, label, value, extraClass = "") {

    const item = document.createElement("div");

    item.className = "finance-item " + extraClass;

    const title = document.createElement("div");

    title.className = "finance-label";

    title.textContent = label;

    const number = document.createElement("div");

    number.className = "finance-value";

    number.textContent = value || "0";

    item.appendChild(title);

    item.appendChild(number);

    parent.appendChild(item);

}

// ================= TÌM KIẾM =================

document.getElementById("searchInput")
    .addEventListener("input", render);

document.getElementById("nvkdFilter")
    .addEventListener("change", render);

// ================= CHI TIẾT KHÁCH HÀNG =================

function showDetail(r) {

    document.getElementById("modal")
        .style.display = "block";

    const detail =
        document.getElementById("detail");

    detail.innerHTML = "";

    const h2 = document.createElement("h2");

    h2.textContent = r.ten;

    detail.appendChild(h2);

    const fields = [

        ["Mã KH:", r.ma],
        ["Địa chỉ:", r.diachi],
        ["NVKD:", r.nvkd],
        ["Quá hạn 1 tháng:", r.qh1],
        ["Quá hạn 2 tháng:", r.qh2],
        ["Quá hạn 3 tháng:", r.qh3],
        ["Tổng công nợ quá hạn:", r.tongqh],
        ["Dư nợ cuối ngày:", r.duno],
        ["Ngày thanh toán gần nhất:", r.thanhtoan],
        ["Ngày mua hàng gần nhất:", r.muahang]

    ];

    fields.forEach((item, index) => {

        if (index === 3 || index === 8) {

            detail.appendChild(
                document.createElement("hr")
            );

        }

        const p = document.createElement("p");

        const label = document.createElement("span");

        label.className = "label";

        label.textContent = item[0] + " ";

        p.appendChild(label);

        p.appendChild(
            document.createTextNode(item[1] || "")
        );

        detail.appendChild(p);

    });

}

// ================= ĐÓNG CHI TIẾT =================

function closeModal() {

    document.getElementById("modal")
        .style.display = "none";

}

// Bấm ra ngoài cửa sổ để đóng

document.getElementById("modal")
    .addEventListener("click", function(e) {

        if (e.target === this) {

            closeModal();

        }

    });

// Nhấn ESC để đóng

document.addEventListener("keydown", function(e) {

    if (e.key === "Escape") {

        closeModal();

    }

});

</script>

</body>
</html>
