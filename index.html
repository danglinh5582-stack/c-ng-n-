<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tra cứu công nợ khách hàng</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

/* ================= GIAO DIỆN CHUNG ================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0 15px 15px 15px;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #222;
}

.container {
    width: 100%;
    max-width: none;
    margin: auto;
}

/* ================= KHU VỰC GHIM ĐẦU TRANG ================= */

.sticky-header {
    position: sticky;
    top: 0;
    z-index: 200;
    background: #f3f4f6;
    padding-top: 15px;
    padding-bottom: 10px;
}

/* ================= TIÊU ĐỀ ================= */

h1 {
    text-align: center;
    color: #0f4c81;
    font-size: 37px;
    font-weight: bold;
    margin: 5px 0 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ================= KHUNG ================= */

.card {
    background: white;
    padding: 18px;
    border-radius: 10px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

/* ================= TÌM KIẾM ================= */

.search-box {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
}

input, select {
    padding: 14px 16px;
    border: 1px solid #aaa;
    border-radius: 7px;
    min-width: 240px;
    font-size: 20px;
    background: white;
    color: #222;
}

#searchInput {
    flex: 1;
    min-width: 280px;
}

/* Ô tích chọn lọc */
.check-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
}

.check-filter input[type=checkbox] {
    min-width: 0;
    width: 24px;
    height: 24px;
    padding: 0;
    cursor: pointer;
}

/* Ô chọn file Excel / CSV */
.file-pick {
    font-size: 17px;
    background: #eef4fa;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px dashed #0f4c81;
}

.file-pick input[type=file] {
    min-width: 0;
    width: auto;
    max-width: 210px;
    padding: 4px;
    font-size: 15px;
    background: transparent;
    border: none;
}

/* ================= THỐNG KÊ ================= */

.stats {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.stat {
    flex: 1;
    min-width: 220px;
    background: #0f4c81;
    color: white;
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 22px;
    font-weight: bold;
}

.stat h2 {
    font-size: 34px;
    margin: 10px 0 2px;
    font-weight: bold;
}

/* ================= BẢNG DỮ LIỆU ================= */

.table-container {
    overflow: visible;
    width: 100%;
    padding-top: 0;
}

.main-table {
    width: 100%;
    min-width: 1660px;
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    background: white;
}

.main-table thead th {
    background: #0f4c81;
    color: white;
    position: sticky;
    top: var(--sticky-offset, 290px);
    z-index: 100;
    font-size: 21px;
    font-weight: bold;
    text-align: center !important;
    vertical-align: middle;
    white-space: normal;
    box-shadow: 0 2px 3px rgba(0,0,0,.15);
    cursor: pointer;
    user-select: none;
}

.main-table thead th:hover {
    background: #0b3961;
}

.main-table th, .main-table td {
    padding: 14px 12px;
    border-right: 1px solid #ccc;
    border-bottom: 1px solid #ccc;
    font-size: 21px;
    line-height: 1.45;
    vertical-align: middle;
}

.main-table th:first-child,
.main-table td:first-child {
    border-left: 1px solid #ccc;
}

.main-table thead th {
    border-top: 1px solid #ccc;
}

.main-table td:nth-child(1) { width: 190px; text-align: left; overflow-wrap: anywhere; }
.main-table th:nth-child(1) { width: 190px; }

.main-table td:nth-child(2) { width: 190px; text-align: left; overflow-wrap: anywhere; }
.main-table th:nth-child(2) { width: 190px; }

.main-table td:nth-child(3) { width: 145px; text-align: center; overflow-wrap: anywhere; }
.main-table th:nth-child(3) { width: 145px; }

.main-table td:nth-child(4),
.main-table td:nth-child(5),
.main-table td:nth-child(6) { width: 120px; text-align: right; white-space: nowrap; }
.main-table th:nth-child(4), .main-table th:nth-child(5), .main-table th:nth-child(6) { width: 120px; }

.main-table td:nth-child(7),
.main-table td:nth-child(8) { width: 150px; text-align: right; white-space: nowrap; font-weight: bold; }
.main-table th:nth-child(7), .main-table th:nth-child(8) { width: 150px; }

.main-table td:nth-child(9),
.main-table td:nth-child(10) { width: 155px; text-align: center; white-space: nowrap; }
.main-table th:nth-child(9), .main-table th:nth-child(10) { width: 155px; }

.main-table td:nth-child(11) { width: 175px; text-align: center; white-space: nowrap; }
.main-table th:nth-child(11) { width: 175px; cursor: default; }

.main-table tbody tr:nth-child(even) {
    background: #f0f5fb;
}

.main-table tbody tr:hover {
    background: #dcecff;
    cursor: pointer;
}

.btn-reconcile {
    background: #0f766e;
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 9px 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.15s ease;
}

.btn-reconcile:hover {
    background: #115e59;
}

.btn-download {
    background: #0f4c81;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.btn-download:hover {
    background: #0b3961;
}

.btn-secondary {
    background: #e5e7eb;
    color: #1f2937;
    border: none;
    border-radius: 8px;
    padding: 12px 18px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}

.btn-secondary:hover {
    background: #d1d5db;
}

/* ================= THÔNG BÁO ================= */

.empty-message {
    text-align: center;
    padding: 30px;
    font-size: 25px;
    color: #666;
}

/* ================= DANH SÁCH ĐIỆN THOẠI ================= */

.mobile-list {
    display: none;
}

.mobile-table-card {
    background: white;
    border-radius: 10px;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,.1);
    overflow-x: auto;
}

    min-width:
